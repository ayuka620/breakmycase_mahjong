<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ブレマイ麻雀</title>
<script src="/socket.io/socket.io.js"></script>
<script src="/tile_images.js"></script>
<style>
:root {
  --bg: #0a1628;
  --gold: #c9a84c;
  --gold-light: #f0d080;
  --tile-bg: #faf3e0;
  --tile-border: #c9a84c;
  --tile-shadow: rgba(0,0,0,0.5);
  --text: #f0e6c8;
  --btn-red: #c0392b;
  --btn-orange: #d35400;
  --btn-purple: #6c3483;
  --btn-green: #1e8449;
  --riichi-bar: #e74c3c;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
html, body {
  width:100%; height:100%; overflow:hidden;
  background:var(--bg); color:var(--text);
  font-family:'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
}

/* Portrait warning */
#pw { display:none; position:fixed; inset:0; z-index:9999; background:var(--bg);
  color:var(--gold); flex-direction:column; align-items:center; justify-content:center;
  gap:14px; font-size:1.3rem; font-weight:bold; text-align:center; }
#pw span { font-size:3rem; }
@media(orientation:portrait){ #pw { display:flex !important; } }

/* ===== LOBBY ===== */
#lobby {
  display:flex; width:100%; height:100%;
  align-items:center; justify-content:center;
  background:radial-gradient(ellipse at center,#1a3a2a 0%,#0a1628 70%);
  padding:16px; gap:24px;
}
#lobby-left { display:flex; flex-direction:column; align-items:center; gap:12px; flex-shrink:0; }
#lobby-right { display:flex; flex-direction:column; gap:12px; width:280px; }
#lobby h1 { font-size:1.6rem; color:var(--gold); letter-spacing:.2em;
  text-shadow:0 0 20px rgba(201,168,76,.5); text-align:center; }
#lobby .subtitle { font-size:.8rem; color:#aaa; letter-spacing:.1em; }
.lobby-card { background:rgba(255,255,255,.05); border:1px solid var(--gold); border-radius:16px;
  padding:20px; display:flex; flex-direction:column; gap:12px; }
.lobby-card h2 { color:var(--gold-light); font-size:.95rem; text-align:center; letter-spacing:.1em; }
.btn { padding:13px 18px; border:none; border-radius:10px; font-size:1rem; font-weight:bold;
  cursor:pointer; transition:all .15s; width:100%; }
.btn:active { transform:scale(.96); }
.btn-gold { background:linear-gradient(135deg,var(--gold),#a07830); color:#1a1000; }
.btn-outline { background:transparent; border:1.5px solid var(--gold); color:var(--gold); }
input[type=text] { padding:12px 16px; border-radius:10px; border:1.5px solid var(--gold);
  background:rgba(255,255,255,.08); color:white; font-size:1.2rem;
  text-align:center; letter-spacing:.3em; text-transform:uppercase; width:100%; }
input[type=text]::placeholder { color:#666; }
#room-code-display { font-size:2.2rem; font-weight:bold; color:var(--gold-light);
  text-align:center; letter-spacing:.4em; text-shadow:0 0 15px rgba(240,208,128,.6); display:none; }
#status-msg { text-align:center; font-size:.88rem; color:#aaa; min-height:18px; }
.waiting-dots span { animation:blink 1.2s infinite; font-size:1.4rem; color:var(--gold); }
.waiting-dots span:nth-child(2){animation-delay:.3s}
.waiting-dots span:nth-child(3){animation-delay:.6s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}

/* ===== GAME ===== */
#game {
  display:none; flex-direction:column;
  width:100%; height:100%;
  background:radial-gradient(ellipse at center,#1a3a2a 0%,#0a1628 100%);
  position:relative; overflow:hidden;
}
#game::before { content:''; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.01) 0,rgba(255,255,255,.01) 1px,transparent 1px,transparent 8px),
  repeating-linear-gradient(-45deg,rgba(255,255,255,.01) 0,rgba(255,255,255,.01) 1px,transparent 1px,transparent 8px); }

/* topbar */
#topbar { display:flex; justify-content:space-between; align-items:center;
  padding:5px 12px; background:rgba(0,0,0,.4); border-bottom:1px solid rgba(201,168,76,.3);
  z-index:10; flex-shrink:0; height:34px; }
#topbar .info { font-size:.7rem; color:var(--gold); }
#deck-count { font-size:.85rem; font-weight:bold; color:var(--gold-light); }
.turn-indicator { font-size:.7rem; padding:3px 10px; border-radius:20px; font-weight:bold; }
.turn-mine { background:var(--btn-green); color:white; }
.turn-opponent { background:#555; color:#aaa; }
#btn-reset-top { padding:3px 10px; border:1px solid var(--gold); border-radius:8px;
  background:transparent; color:var(--gold); font-size:.7rem; font-weight:bold; cursor:pointer; }

/* opponent area */
#opponent-area { flex-shrink:0; padding:4px 8px 3px;
  background:rgba(0,0,0,.25); border-bottom:1px solid rgba(255,255,255,.05);
  display:flex; align-items:flex-end; justify-content:center; position:relative; min-height:40px; }
/* 相手の公開牌・鳴き牌は左上 */
#opp-left { position:absolute; left:6px; bottom:3px; display:flex; gap:4px; align-items:flex-end; }
#opp-melds { display:flex; gap:2px; align-items:flex-end; }
#opp-reveals { display:flex; gap:2px; align-items:flex-end; }
#opponent-hand { display:flex; gap:2px; justify-content:center; flex-wrap:wrap; align-items:flex-end; }
.tile-back { width:26px; height:38px; border-radius:4px; border:1px solid var(--gold);
  background:linear-gradient(135deg,#1a3a2a,#0f2d1e); display:flex;
  align-items:center; justify-content:center; font-size:13px;
  box-shadow:0 2px 4px rgba(0,0,0,.5); flex-shrink:0; }

/* center */
#center-area { flex:1; display:flex; gap:8px; padding:6px 8px; min-height:0; overflow:hidden; position:relative; }
.discard-zone { flex:1; background:rgba(0,0,0,.2); border-radius:8px;
  border:1px solid rgba(201,168,76,.2); padding:5px; overflow-y:auto; }
.discard-zone h3 { font-size:.6rem; color:#888; margin-bottom:3px; text-align:center; letter-spacing:.1em; }
.discard-tiles { display:flex; flex-wrap:wrap; gap:2px; }

/* butterfly center */
#butterfly { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  pointer-events:none; z-index:0; width:90px; height:90px; }

/* tiles */
.tile { width:38px; height:52px; border-radius:5px; border:1.5px solid var(--tile-border);
  background:var(--tile-bg); overflow:hidden;
  box-shadow:0 3px 6px var(--tile-shadow),inset 0 1px 0 rgba(255,255,255,.5);
  cursor:pointer; transition:transform .15s,box-shadow .15s;
  flex-shrink:0; position:relative; touch-action:none; }
.tile img { width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; }
.tile.selected { transform:translateY(-8px); box-shadow:0 8px 16px rgba(201,168,76,.6),0 0 0 2px var(--gold); }
.tile.newtile::after { content:''; position:absolute; inset:0; border-radius:3px;
  box-shadow:inset 0 0 0 2px #f0d080; pointer-events:none; }
.tile.meld-tile   { border-color:#e74c3c; opacity:.9; }
.tile.reveal-tile { border-color:#27ae60; opacity:.9; }
.tile.dov { box-shadow:0 0 0 2px #4fc3f7,0 3px 6px rgba(0,0,0,.5); }
.tile-sm { width:26px; height:36px; border-radius:4px; border:1px solid var(--tile-border);
  background:var(--tile-bg); overflow:hidden; box-shadow:0 1px 3px var(--tile-shadow); }
.tile-sm img { width:100%; height:100%; object-fit:cover; display:block; }
.tile-sm-meld { width:22px; height:30px; border-radius:3px; border:1px solid #e74c3c;
  background:var(--tile-bg); overflow:hidden; flex-shrink:0; }
.tile-sm-meld img { width:100%; height:100%; object-fit:cover; display:block; }
.tile-sm-reveal { width:22px; height:30px; border-radius:3px; border:1px solid #27ae60;
  background:var(--tile-bg); overflow:hidden; flex-shrink:0; }
.tile-sm-reveal img { width:100%; height:100%; object-fit:cover; display:block; }
/* 捨て牌（クリック可能） */
.tile-sm.clickable { cursor:pointer; transition:transform .1s; }
.tile-sm.clickable:active { transform:scale(.92); }
.tile-sm.opp-selected { box-shadow:0 0 0 2px #4fc3f7; transform:scale(1.08); }

/* action bar */
#action-bar { display:flex; gap:5px; padding:5px 8px; background:rgba(0,0,0,.4);
  flex-wrap:wrap; justify-content:center; flex-shrink:0;
  border-top:1px solid rgba(201,168,76,.2); border-bottom:1px solid rgba(201,168,76,.2); }
.action-btn { padding:8px 12px; border:none; border-radius:8px; font-size:.82rem;
  font-weight:bold; cursor:pointer; transition:all .15s; color:white;
  letter-spacing:.05em; min-width:52px; height:42px; }
.action-btn:active { transform:scale(.93); }
.btn-discard { background:var(--btn-red); }
.btn-pon     { background:var(--btn-orange); }
.btn-kan     { background:var(--btn-purple); }
.btn-ron     { background:#8e44ad; }
.btn-tsumo   { background:var(--btn-green); }
.btn-reveal  { background:#1a6b3a; border:1px solid #27ae60; }

/* my hand */
#my-area { flex-shrink:0; padding:4px 6px 6px; background:rgba(0,0,0,.3);
  border-top:1px solid rgba(201,168,76,.3); }
#my-hand { display:flex; gap:3px; flex-wrap:nowrap; overflow-x:auto;
  padding-bottom:3px; padding-top:10px; min-height:66px;
  align-items:flex-end; -webkit-overflow-scrolling:touch; }
#my-hand::-webkit-scrollbar { height:3px; }
#my-hand::-webkit-scrollbar-thumb { background:var(--gold); border-radius:2px; }
.drawn-separator  { width:3px; height:52px; background:rgba(201,168,76,.5);
  border-radius:2px; flex-shrink:0; align-self:flex-end; }
.meld-separator   { width:6px; flex-shrink:0; align-self:flex-end; height:52px; }
.reveal-separator { width:6px; flex-shrink:0; align-self:flex-end; height:52px; }

/* overlays */
#notification { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(.5);
  background:rgba(0,0,0,.85); border:2px solid var(--gold); border-radius:16px;
  padding:18px 28px; text-align:center; font-size:1.4rem; font-weight:bold;
  color:var(--gold-light); z-index:100; opacity:0; transition:all .2s;
  pointer-events:none; letter-spacing:.2em; white-space:nowrap; }
#notification.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
#toast { position:absolute; bottom:100px; left:50%; transform:translateX(-50%);
  background:rgba(200,50,50,.9); color:white; padding:7px 18px; border-radius:18px;
  font-size:.82rem; opacity:0; transition:opacity .3s; z-index:200; white-space:nowrap; }
#toast.show { opacity:1; }
#gameover-overlay { display:none; position:absolute; inset:0; background:rgba(0,0,0,.8);
  z-index:50; flex-direction:column; align-items:center; justify-content:center; gap:18px; }
#gameover-overlay.show { display:flex; }
#gameover-overlay h2 { font-size:1.8rem; color:var(--gold-light); }
#gameover-overlay .btn { max-width:180px; }
</style>
</head>
<body>

<div id="pw"><span>📱</span>横向きにしてください</div>

<!-- LOBBY -->
<div id="lobby">
  <div id="lobby-left">
    <h1>🀄 ブレマイ麻雀</h1>
    <p class="subtitle">2人対戦</p>
    <div id="room-code-display"></div>
    <p id="status-msg"></p>
    <div class="waiting-dots" id="waiting-dots" style="display:none">
      <span>●</span><span>●</span><span>●</span>
    </div>
  </div>
  <div id="lobby-right">
    <div class="lobby-card">
      <h2>ルームを作る</h2>
      <button class="btn btn-gold" onclick="createRoom()">ルーム作成</button>
    </div>
    <div class="lobby-card">
      <h2>ルームに入る</h2>
      <input type="text" id="room-input" placeholder="コードを入力" maxlength="4">
      <button class="btn btn-outline" onclick="joinRoom()">参加する</button>
    </div>
  </div>
</div>

<!-- GAME -->
<div id="game">
  <div id="topbar">
    <div class="info">🀄 ブレマイ麻雀</div>
    <div class="turn-indicator" id="turn-indicator">待機中</div>
    <div>残り <span id="deck-count">--</span> 枚</div>
    <button id="btn-reset-top" onclick="resetGame()">再戦</button>
  </div>

  <div id="opponent-area">
    <div id="opp-left">
      <div id="opp-melds"></div>
      <div id="opp-reveals"></div>
    </div>
    <div id="opponent-hand"></div>
  </div>

  <svg id="butterfly" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="g1" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#e8f4ff" stop-opacity=".95"/>
        <stop offset="100%" stop-color="#7ec8e3" stop-opacity=".2"/>
      </radialGradient>
      <radialGradient id="g2" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ead4f8" stop-opacity=".95"/>
        <stop offset="100%" stop-color="#9b59b6" stop-opacity=".2"/>
      </radialGradient>
      <filter id="gf"><feGaussianBlur stdDeviation="1.8" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <path d="M55 56 C48 42 26 28 14 36 C4 44 16 62 34 61 C44 60 52 58 55 56Z" fill="url(#g1)" stroke="#b8dff4" stroke-width="1" filter="url(#gf)" opacity=".95"/>
    <path d="M55 56 C62 42 84 28 96 36 C106 44 94 62 76 61 C66 60 58 58 55 56Z" fill="url(#g1)" stroke="#b8dff4" stroke-width="1" filter="url(#gf)" opacity=".95"/>
    <path d="M55 56 C46 62 24 70 18 80 C12 90 28 95 42 86 C50 80 54 68 55 56Z" fill="url(#g2)" stroke="#cda8f0" stroke-width="1" filter="url(#gf)" opacity=".88"/>
    <path d="M55 56 C64 62 86 70 92 80 C98 90 82 95 68 86 C60 80 56 68 55 56Z" fill="url(#g2)" stroke="#cda8f0" stroke-width="1" filter="url(#gf)" opacity=".88"/>
    <ellipse cx="55" cy="56" rx="2.2" ry="11" fill="#9ad4ee" opacity=".92"/>
    <path d="M54 46 C50 38 44 33 41 30" fill="none" stroke="#b0d8f0" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M56 46 C60 38 66 33 69 30" fill="none" stroke="#b0d8f0" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="41" cy="30" r="2.2" fill="#d0eeff" opacity=".85"/>
    <circle cx="69" cy="30" r="2.2" fill="#d0eeff" opacity=".85"/>
    <circle cx="32" cy="48" r="2.5" fill="#c8eeff" opacity=".7"/>
    <circle cx="78" cy="48" r="2.5" fill="#c8eeff" opacity=".7"/>
    <circle cx="30" cy="76" r="2" fill="#e0c8ff" opacity=".65"/>
    <circle cx="80" cy="76" r="2" fill="#e0c8ff" opacity=".65"/>
  </svg>

  <div id="center-area">
    <div class="discard-zone">
      <h3>相手の捨て牌</h3>
      <div class="discard-tiles" id="opp-discards"></div>
    </div>
    <div class="discard-zone">
      <h3>自分の捨て牌</h3>
      <div class="discard-tiles" id="my-discards"></div>
    </div>
  </div>

  <div id="action-bar">
    <button class="action-btn btn-discard" onclick="discardSelected()">捨牌</button>
    <button class="action-btn btn-pon"     onclick="callAction('pon')">ポン</button>
    <button class="action-btn btn-kan"     onclick="callAction('kan')">カン</button>
    <button class="action-btn btn-ron"     onclick="callAction('ron')">ロン</button>
    <button class="action-btn btn-tsumo"   onclick="callAction('tsumo')">ツモ</button>
    <button class="action-btn btn-reveal"  onclick="revealSelected()">公開</button>
  </div>

  <div id="my-area">
    <div id="my-hand"></div>
  </div>

  <div id="notification"></div>
  <div id="toast"></div>
  <div id="gameover-overlay">
    <h2 id="gameover-msg">流局</h2>
    <button class="btn btn-gold" onclick="resetGame()">再戦する</button>
    <button class="btn btn-outline" onclick="location.reload()">ロビーへ</button>
  </div>
</div>

<script>
const socket = io();
let myRoom = null, myIndex = null;
let selectedTileId = null;
let selectedOppDiscardId = null; // 相手捨て牌の選択
let myHand = [];
let myMelds = [];
let myReveals = []; // 公開した牌
let drawnTileId = null;

// drag
let dragEl = null, dragSrc = null, dragClone = null, dragging = false;
let dsx = 0, dsy = 0, dox = 0, doy = 0;

// ===== SOCKET =====
socket.on('room_created', ({ code, playerIndex }) => {
  myRoom = code; myIndex = playerIndex;
  const d = document.getElementById('room-code-display');
  d.style.display = 'block'; d.textContent = code;
  document.getElementById('status-msg').textContent = '友達にこのコードを教えてください';
  document.getElementById('waiting-dots').style.display = 'flex';
});

socket.on('room_joined', ({ code, playerIndex }) => {
  myRoom = code; myIndex = playerIndex;
  document.getElementById('status-msg').textContent = '接続しました！';
});

socket.on('player_joined', ({ count }) => {
  if (count === 2) {
    document.getElementById('status-msg').textContent = '2人揃いました！';
    document.getElementById('waiting-dots').style.display = 'none';
    setTimeout(() => socket.emit('start_game', { code: myRoom }), 500);
  }
});

socket.on('error', ({ message }) => showToast(message));

socket.on('game_start', ({ myHand: hand, opponentCount, currentTurn, myIndex: idx, deckRemaining }) => {
  myIndex = idx; myHand = hand; myMelds = []; myReveals = [];
  drawnTileId = null; selectedTileId = null; selectedOppDiscardId = null;
  document.getElementById('lobby').style.display = 'none';
  document.getElementById('game').style.display = 'flex';
  document.getElementById('gameover-overlay').classList.remove('show');
  renderHand(); renderOpponentHand(opponentCount);
  updateDeckCount(deckRemaining); updateTurnIndicator(currentTurn);
  clearDiscards();
  document.getElementById('opp-melds').innerHTML = '';
  document.getElementById('opp-reveals').innerHTML = '';
  if (currentTurn === myIndex) setTimeout(drawTile, 400);
});

socket.on('tile_drawn', ({ tile, deckRemaining }) => {
  drawnTileId = tile.id;
  myHand.push(tile);
  renderHand(); updateDeckCount(deckRemaining);
});

socket.on('opponent_drew', ({ deckRemaining }) => {
  renderOpponentHand(document.getElementById('opponent-hand').children.length + 1);
  updateDeckCount(deckRemaining);
});

socket.on('tile_discarded', ({ player, tileId, discards, handCounts }) => {
  renderDiscards(discards);
  renderOpponentHand(handCounts[1 - myIndex]);
  if (player === myIndex) {
    myHand = myHand.filter(t => t.id !== tileId);
    drawnTileId = null; selectedTileId = null;
    renderHand();
  }
});

socket.on('turn_changed', ({ currentTurn }) => {
  updateTurnIndicator(currentTurn);
  if (currentTurn === myIndex) setTimeout(drawTile, 300);
});

socket.on('action_called', ({ player, action, handCounts }) => {
  const labels = { pon:'ポン！', chi:'チー！', kan:'カン！', riichi:'リーチ！', ron:'ロン！', tsumo:'ツモ！' };
  if (labels[action]) showNotification((player === myIndex ? 'あなた: ' : '相手: ') + labels[action]);
  renderOpponentHand(handCounts[1 - myIndex]);
});

socket.on('hand_updated', ({ myHand: hand, discards }) => {
  const newTile = hand.find(t => !myHand.some(h => h.id === t.id));
  if (newTile) myMelds.push(newTile);
  myHand = hand.filter(t => !myMelds.some(m => m.id === t.id));
  drawnTileId = null;
  renderHand(); renderDiscards(discards);
});

// 公開イベント受信
socket.on('tiles_revealed', ({ player, tiles }) => {
  if (player !== myIndex) {
    // 相手の公開牌を左上に表示
    const container = document.getElementById('opp-reveals');
    tiles.forEach(t => {
      const el = document.createElement('div');
      el.className = 'tile-sm-reveal';
      const img = document.createElement('img');
      img.src = TILE_IMAGES[t.tile];
      el.appendChild(img); container.appendChild(el);
    });
    showNotification('相手が公開！');
  }
});

// 相手捨て牌を手牌に加える
socket.on('opp_discard_taken', ({ tileId, tile, discards, handCounts }) => {
  // 自分の手牌に追加（drawnTileと同じ扱い）
  const newTile = { id: tileId, tile };
  drawnTileId = tileId;
  myHand.push(newTile);
  selectedOppDiscardId = null;
  renderHand();
  renderDiscards(discards);
  renderOpponentHand(handCounts[1 - myIndex]);
});

socket.on('game_over', ({ reason }) => {
  document.getElementById('gameover-msg').textContent = reason;
  document.getElementById('gameover-overlay').classList.add('show');
});

socket.on('player_left', () => showToast('相手が切断しました'));

// ===== RENDER =====
function renderHand() {
  const container = document.getElementById('my-hand');
  container.innerHTML = '';

  const main = myHand.filter(t => t.id !== drawnTileId);
  main.forEach((t, i) => container.appendChild(makeTile(t, i, false)));

  if (drawnTileId !== null) {
    container.appendChild(Object.assign(document.createElement('div'), { className: 'drawn-separator' }));
    const dt = myHand.find(t => t.id === drawnTileId);
    if (dt) container.appendChild(makeTile(dt, main.length, true));
  }

  if (myMelds.length > 0) {
    container.appendChild(Object.assign(document.createElement('div'), { className: 'meld-separator' }));
    myMelds.forEach(t => {
      const el = makeTile(t, -1, false);
      el.classList.add('meld-tile');
      el.style.pointerEvents = 'none';
      container.appendChild(el);
    });
  }

  if (myReveals.length > 0) {
    container.appendChild(Object.assign(document.createElement('div'), { className: 'reveal-separator' }));
    myReveals.forEach(t => {
      const el = makeTile(t, -1, false);
      el.classList.add('reveal-tile');
      el.style.pointerEvents = 'none';
      container.appendChild(el);
    });
  }
}

function makeTile(t, idx, isNew) {
  const el = document.createElement('div');
  el.className = 'tile' + (isNew ? ' newtile' : '') + (t.id === selectedTileId ? ' selected' : '');
  el.dataset.id = t.id;
  el.dataset.idx = idx;
  const img = document.createElement('img');
  img.src = TILE_IMAGES[t.tile];
  img.draggable = false;
  el.appendChild(img);
  el.addEventListener('pointerdown', onPD);
  return el;
}

function renderOpponentHand(count) {
  const container = document.getElementById('opponent-hand');
  container.innerHTML = '';
  for (let i = 0; i < Math.max(0, count); i++) {
    const b = document.createElement('div');
    b.className = 'tile-back'; b.textContent = '🀫';
    container.appendChild(b);
  }
}

function renderDiscards(discards) {
  const myD  = discards[myIndex]     || [];
  const oppD = discards[1 - myIndex] || [];
  const myEl  = document.getElementById('my-discards');
  const oppEl = document.getElementById('opp-discards');
  myEl.innerHTML = ''; oppEl.innerHTML = '';
  myD.forEach(t => myEl.appendChild(makeSmall(t, false)));
  // 相手捨て牌はタップで選択可能
  oppD.forEach(t => oppEl.appendChild(makeSmall(t, true)));
}

function makeSmall(t, clickable) {
  const el = document.createElement('div');
  el.className = 'tile-sm' + (clickable ? ' clickable' : '') + (t.id === selectedOppDiscardId ? ' opp-selected' : '');
  el.dataset.id = t.id;
  el.dataset.tile = t.tile;
  const img = document.createElement('img');
  img.src = TILE_IMAGES[t.tile];
  el.appendChild(img);
  if (clickable) {
    el.addEventListener('click', () => {
      selectedOppDiscardId = (selectedOppDiscardId === t.id) ? null : t.id;
      renderDiscards({ [myIndex]: [], [1 - myIndex]: Array.from(document.getElementById('opp-discards').children).map(c => ({ id: Number(c.dataset.id), tile: Number(c.dataset.tile) })) });
      // 再描画のため全体を再取得するより、単純にクラスを切り替える
      document.querySelectorAll('#opp-discards .tile-sm').forEach(e => e.classList.remove('opp-selected'));
      if (selectedOppDiscardId !== null) el.classList.add('opp-selected');
    });
  }
  return el;
}

function clearDiscards() {
  document.getElementById('my-discards').innerHTML = '';
  document.getElementById('opp-discards').innerHTML = '';
  selectedOppDiscardId = null;
}

// ===== DRAG & TAP =====
function onPD(e) {
  dragEl = e.currentTarget;
  dragSrc = Number(dragEl.dataset.idx);
  dsx = e.clientX; dsy = e.clientY;
  const r = dragEl.getBoundingClientRect();
  dox = e.clientX - r.left; doy = e.clientY - r.top;
  document.addEventListener('pointermove', onPM, { passive: false });
  document.addEventListener('pointerup', onPU);
  e.preventDefault();
}

function onPM(e) {
  if (!dragEl) return;
  const dx = e.clientX - dsx, dy = e.clientY - dsy;
  if (!dragging && Math.sqrt(dx*dx + dy*dy) > 8) {
    dragging = true;
    dragClone = dragEl.cloneNode(true);
    Object.assign(dragClone.style, {
      position:'fixed', zIndex:9999, pointerEvents:'none',
      width: dragEl.offsetWidth + 'px', height: dragEl.offsetHeight + 'px',
      opacity:'.85', transform:'scale(1.1)', borderRadius:'5px',
      overflow:'hidden', boxShadow:'0 8px 20px rgba(0,0,0,.7)'
    });
    document.body.appendChild(dragClone);
    dragEl.style.opacity = '.25';
  }
  if (dragging && dragClone) {
    dragClone.style.left = (e.clientX - dox) + 'px';
    dragClone.style.top  = (e.clientY - doy) + 'px';
    document.querySelectorAll('.dov').forEach(t => t.classList.remove('dov'));
    dragClone.style.display = 'none';
    const under = document.elementFromPoint(e.clientX, e.clientY);
    dragClone.style.display = '';
    const tt = under?.closest('.tile');
    if (tt && tt !== dragEl && Number(tt.dataset.idx) >= 0) tt.classList.add('dov');
  }
  e.preventDefault();
}

function onPU(e) {
  document.removeEventListener('pointermove', onPM);
  document.removeEventListener('pointerup', onPU);
  if (!dragging) {
    if (dragEl) {
      const id = Number(dragEl.dataset.id);
      selectedTileId = (selectedTileId === id) ? null : id;
      renderHand();
    }
  } else {
    if (dragClone) { dragClone.remove(); dragClone = null; }
    if (dragEl) dragEl.style.opacity = '';
    document.querySelectorAll('.dov').forEach(t => t.classList.remove('dov'));
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const tt = under?.closest('.tile');
    if (tt && tt.dataset.idx !== undefined) {
      const dst = Number(tt.dataset.idx);
      if (dst >= 0 && dragSrc >= 0 && dragSrc !== dst) reorderHand(dragSrc, dst);
    }
  }
  dragging = false; dragEl = null; dragSrc = null;
}

function reorderHand(from, to) {
  const main = myHand.filter(t => t.id !== drawnTileId);
  const drawn = myHand.find(t => t.id === drawnTileId);
  const item = main.splice(from, 1)[0];
  if (item) main.splice(to, 0, item);
  myHand = drawn ? [...main, drawn] : main;
  renderHand();
}

// ===== ACTIONS =====
function createRoom() { socket.emit('create_room'); }
function joinRoom() {
  const code = document.getElementById('room-input').value.trim().toUpperCase();
  if (code.length !== 4) { showToast('4文字のコードを入力してください'); return; }
  socket.emit('join_room', { code });
}
function drawTile() { socket.emit('draw_tile', { code: myRoom }); }

function discardSelected() {
  if (selectedTileId === null) { showToast('捨てる牌を選んでください'); return; }
  socket.emit('discard_tile', { code: myRoom, tileId: selectedTileId });
}

function callAction(action) {
  if (['pon', 'kan', 'ron'].includes(action) && selectedOppDiscardId !== null) {
    socket.emit('take_opp_discard', { code: myRoom, tileId: selectedOppDiscardId });
    return;
  }
  socket.emit('call_action', { code: myRoom, action });
}
function resetGame() { socket.emit('reset_game', { code: myRoom }); }

// 公開ボタン: 選択中の牌を公開
function revealSelected() {
  if (selectedTileId === null) { showToast('公開する牌を選んでください'); return; }
  const tile = myHand.find(t => t.id === selectedTileId);
  if (!tile) { showToast('牌が見つかりません'); return; }
  // ローカルで公開エリアへ移動
  myHand = myHand.filter(t => t.id !== selectedTileId);
  if (drawnTileId === selectedTileId) drawnTileId = null;
  myReveals.push(tile);
  selectedTileId = null;
  renderHand();
  // サーバーに通知（相手に見せる）
  socket.emit('reveal_tiles', { code: myRoom, tiles: [{ id: tile.id, tile: tile.tile }] });
}

// 相手捨て牌を手牌に取る
function takeOppDiscard() {
  if (selectedOppDiscardId === null) { showToast('相手の捨て牌を選んでください'); return; }
  socket.emit('take_opp_discard', { code: myRoom, tileId: selectedOppDiscardId });
}

// ===== HELPERS =====
function updateDeckCount(n) { document.getElementById('deck-count').textContent = n; }
function updateTurnIndicator(turn) {
  const el = document.getElementById('turn-indicator');
  if (turn === myIndex) { el.textContent = '自分のターン'; el.className = 'turn-indicator turn-mine'; }
  else { el.textContent = '相手のターン'; el.className = 'turn-indicator turn-opponent'; }
}
let notifTimer;
function showNotification(msg) {
  const el = document.getElementById('notification');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(notifTimer); notifTimer = setTimeout(() => el.classList.remove('show'), 1800);
}
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
